plugins {
    id 'base'
}

def gitIdentity = providers.exec {
    commandLine 'git', 'describe', '--always', '--dirty'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unversioned' }

allprojects {
    group = 'dev.julia'
    version = gitIdentity.get()
    repositories {
        mavenCentral()
        maven {
            url = uri('https://libraries.minecraft.net/')
            content { includeGroup 'com.mojang' }
        }
        maven {
            url = uri('https://nexus.gtnewhorizons.com/repository/public/')
            content {
                includeGroup 'com.gtnewhorizons.angelica'
                includeGroup 'com.github.GTNewHorizons'
                includeGroup 'org.taumc'
                includeGroup 'io.github.legacymoddingmc'
            }
        }
        maven {
            url = uri('https://maven.minecraftforge.net/')
            content { includeGroup 'net.minecraftforge' }
        }
        maven {
            url = uri('https://maven.taumc.org/releases/')
            content { includeGroup 'org.taumc' }
        }
    }
}

subprojects {
    apply plugin: 'java-library'
    dependencyLocking {
        lockAllConfigurations()
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.withType(org.gradle.jvm.application.tasks.CreateStartScripts).configureEach {
        doLast { windowsScript.delete() }
    }
    java {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
        withSourcesJar()
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
        options.compilerArgs += ['-Xlint:all', '-Werror']
    }
    dependencies {
        testImplementation platform('org.junit:junit-bom:6.1.3')
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }
    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        testLogging {
            events 'failed'
            exceptionFormat = 'full'
        }
    }
}

tasks.named('check') {
    dependsOn subprojects.collect { it.tasks.named('check') }
}
tasks.named('assemble') {
    dependsOn subprojects.collect { it.tasks.named('assemble') }
}

tasks.named('wrapper') {
    gradleVersion = '9.8.1'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = 'dce76f55f8e251a3a1f130eb120f30b3d271de2b76c9b0729d316b5a1b6dc01f'
}
