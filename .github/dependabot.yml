version: 2

updates:
  # The Gradle build in java/: buildSrc, the version catalog, and every module's gradle.lockfile.
  - package-ecosystem: gradle
    directories:
      - /java
      - /java/buildSrc
    schedule:
      interval: weekly
    groups:
      angelica:
        patterns:
          - "com.gtnewhorizons*"
          - "com.github.GTNewHorizons*"
      lwjgl:
        patterns:
          - "org.lwjgl*"
      build-tooling:
        patterns:
          - "com.diffplug.spotless*"
          - "com.palantir.javaformat*"
          - "org.junit*"
      libraries:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
