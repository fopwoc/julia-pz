name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release tags are x.y.z commits on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      sign: true
    secrets:
      ZBS_PRIVATE_KEY: ${{ secrets.ZBS_PRIVATE_KEY }}

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      # Full submodule history, so the release notes can count fork commits between pins.
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: julia-dist
          path: dist

      - name: Name release files
        run: |
          mkdir release
          mv dist/julia-agent.jar "release/julia-$GITHUB_REF_NAME-agent.jar"
          mv dist/julia-preload.jar "release/julia-$GITHUB_REF_NAME-preload.jar"
          mv dist/julia-preload.jar.zbs "release/julia-$GITHUB_REF_NAME-preload.jar.zbs"
          mv dist/julia.dll "release/julia-$GITHUB_REF_NAME-windows-loader.dll"
          mv dist/julia-mod.zip "release/julia-$GITHUB_REF_NAME-mod.zip"
          mv dist/julia-workshop.zip "release/julia-$GITHUB_REF_NAME-workshop.zip"
          mv dist/julia-sources.zip "release/julia-$GITHUB_REF_NAME-sources.zip"
          (cd release && sha256sum -- * > SHA256SUMS)

      # Signed SLSA build provenance: anyone can check a jar against this repository and workflow.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/julia-*-agent.jar
            release/julia-*-preload.jar
            release/julia-*-windows-loader.dll
            release/julia-*-mod.zip
            release/julia-*-workshop.zip
            release/julia-*-sources.zip

      - name: Write release notes
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" --match '*.*.*' 2>/dev/null || true)"
          {
            echo "## Changes"
            if [[ -n "$previous_tag" ]]; then
              git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              git log --format='- %s (%h)' -n 1 "$GITHUB_SHA"
            fi

            # Releases before the forks used published Angelica, so their changes start where each fork left upstream.
            angelica_old=2b46b4f602dfd7c6b5dd67f42acd853adfa1d9c6
            gtnhlib_old=8881288313af824d23fb449d7f76c80391b44304
            # ls-tree, not rev-parse --verify: a pin names a commit that lives only in the submodule's own repository.
            pin_at() { git -C "$1" ls-tree "$2" "$3" | awk '$2 == "commit" { print $3 }'; }
            pin="$([[ -n "$previous_tag" ]] && pin_at . "$previous_tag" third_party/angelica || true)"
            if [[ -n "$pin" ]]; then
              angelica_old="$pin"
              gtnhlib_old="$(pin_at third_party/angelica "$pin" third_party/gtnhlib)"
            fi
            angelica_new="$(pin_at . "$GITHUB_SHA" third_party/angelica)"
            gtnhlib_new="$(pin_at third_party/angelica "$angelica_new" third_party/gtnhlib)"
            fork_line() { # name, repository, checkout, old pin, new pin
              local count
              count="$(git -C "$3" rev-list --first-parent --count "$4..$5")"
              if (( count > 0 )); then
                echo "- $1: [$count commits](https://github.com/$2/compare/$4...$5)"
              fi
            }
            forks="$(
              fork_line Angelica fopwoc/Angelica third_party/angelica "$angelica_old" "$angelica_new"
              fork_line GTNHLib fopwoc/GTNHLib third_party/angelica/third_party/gtnhlib "$gtnhlib_old" "$gtnhlib_new"
            )"
            if [[ -n "$forks" ]]; then
              printf '\n## Renderer forks\n%s\n' "$forks"
            fi
            cat <<NOTES

          ## Verify
          The preload jar, agent jar and Windows loader are built and signed by this repository's release workflow.
          Check any copy, including the one in the Workshop item (\`libs/julia-preload.jar\`), with the GitHub CLI:

          \`\`\`
          gh attestation verify julia-preload.jar --repo $GITHUB_REPOSITORY
          gh attestation verify julia-agent.jar --repo $GITHUB_REPOSITORY
          gh attestation verify julia.dll --repo $GITHUB_REPOSITORY
          \`\`\`

          \`\`\`
          $(cat release/SHA256SUMS)
          \`\`\`
          NOTES
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
