name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release tags are x.y.z commits on main
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build:
    needs: verify
    uses: ./.github/workflows/build.yml

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: julia-dist
          path: dist

      - name: Name release files
        run: |
          mkdir release
          mv dist/julia-agent.jar "release/julia-$GITHUB_REF_NAME-agent.jar"
          mv dist/julia.dll "release/julia-$GITHUB_REF_NAME-windows-loader.dll"
          mv dist/julia-mod.zip "release/julia-$GITHUB_REF_NAME-mod.zip"
          mv dist/julia-workshop.zip "release/julia-$GITHUB_REF_NAME-workshop.zip"
          (cd release && sha256sum -- * > SHA256SUMS)

      # Signed SLSA build provenance: anyone can check a jar against this repository and workflow.
      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            release/julia-*-agent.jar
            release/julia-*-windows-loader.dll
            release/julia-*-mod.zip
            release/julia-*-workshop.zip

      - name: Write release notes
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" --match '*.*.*' 2>/dev/null || true)"
          {
            echo "## Changes"
            if [[ -n "$previous_tag" ]]; then
              git log --format='- %s (%h)' "$previous_tag..$GITHUB_SHA"
            else
              git log --format='- %s (%h)' -n 1 "$GITHUB_SHA"
            fi
            cat <<NOTES

          ## Verify
          The agent jar and the Windows loader are built and signed by this repository's release workflow. Check any
          copy, including the ones in the Workshop item (\`libs/julia-agent.jar\`, \`libs/julia.dll\`), with the
          GitHub CLI:

          \`\`\`
          gh attestation verify julia-agent.jar --repo $GITHUB_REPOSITORY
          gh attestation verify julia.dll --repo $GITHUB_REPOSITORY
          \`\`\`

          \`\`\`
          $(cat release/SHA256SUMS)
          \`\`\`
          NOTES
          } > release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --notes-file release-notes.md
