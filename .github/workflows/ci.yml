name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - COPYRIGHT
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - COPYRIGHT

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: java

jobs:
  build:
    name: Check and package
    # The mod bundles host-specific LWJGL natives; Metal on Apple Silicon is the first target.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Temurin 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: java

      - name: Check and build distributions
        run: >-
          ./gradlew
          check
          :zomboid-mod:modZip
          :probe:distZip
          :gl-audit:distZip
          :agent:jar

      - name: Upload mod
        uses: actions/upload-artifact@v7
        with:
          name: julia-mod
          path: java/modules/zomboid-mod/build/distributions/Julia.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload tools
        uses: actions/upload-artifact@v7
        with:
          name: julia-tools
          path: |
            java/modules/probe/build/distributions/*.zip
            java/modules/gl-audit/build/distributions/*.zip
            java/modules/agent/build/libs/julia-agent.jar
          retention-days: 7
          if-no-files-found: error
