rootProject.name = 'julia-zomboid'

// Layers, bottom-up: utils → gl-audit → backend → transform → host → probe → zomboid-mod.
// render-runtime is JDK-only and shared across the host/isolated loader boundary.
[
    'utils',
    'gl-audit',
    'agent',
    'render-runtime',
    'backend',
    'transform',
    'host',
    'probe',
    'zomboid-mod',
].each { name ->
    include(name)
    project(":${name}").projectDir = file("modules/${name}")
}
