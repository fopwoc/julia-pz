// Code that runs inside the isolated graphics runtime: hosted SDL backend, GL bridges, window binding.

def operatingSystem = System.getProperty('os.name')
def architecture = System.getProperty('os.arch')
if (!(architecture in ['aarch64', 'arm64', 'amd64', 'x86_64'])) {
    throw new GradleException('The graphics backend supports ARM64 and x86-64')
}
def arm = architecture in ['aarch64', 'arm64']
def nativeClassifier = switch (operatingSystem) {
    case 'Mac OS X' -> arm ? 'natives-macos-arm64' : 'natives-macos'
    case 'Linux' -> arm ? 'natives-linux-arm64' : 'natives-linux'
    default -> throw new GradleException('The graphics backend supports macOS and Linux')
}

dependencies {
    api project(':render-runtime')
    api('com.gtnewhorizons.angelica:sdl-gpu:2.2.34') {
        // The upstream publication carries the publishing host's Linux natives.
        exclude group: 'org.lwjgl'
    }
    for (module in ['lwjgl', 'lwjgl-sdl', 'lwjgl-shaderc', 'lwjgl-spvc', 'lwjgl-opengl']) {
        api "org.lwjgl:${module}:3.4.2"
        runtimeOnly "org.lwjgl:${module}:3.4.2:${nativeClassifier}"
    }
    implementation('com.github.GTNewHorizons:lwjgl3ify:3.0.31:dev') { transitive = false }

    // Angelica expects these to be supplied by its host application.
    runtimeOnly('com.gtnewhorizons.retrofuturabootstrap:RetroFuturaBootstrap:1.1.0') { transitive = false }
    // ShaderManager's debug-environment check references Launch.blackboard. Never launch it.
    runtimeOnly('net.minecraft:launchwrapper:1.12') { transitive = false }
    runtimeOnly 'org.apache.commons:commons-lang3:3.21.0'
    runtimeOnly 'org.joml:joml:1.10.8'
    runtimeOnly 'it.unimi.dsi:fastutil:8.5.18'
    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.26.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    runtimeOnly 'com.google.guava:guava:33.7.2-jre'
}
