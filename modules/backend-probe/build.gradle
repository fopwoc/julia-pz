plugins {
    id 'application'
}

def operatingSystem = System.getProperty('os.name')
def architecture = System.getProperty('os.arch')
if (!(architecture in ['aarch64', 'arm64', 'amd64', 'x86_64'])) {
    throw new GradleException('The backend probe supports ARM64 and x86-64')
}
def nativeClassifier
if (operatingSystem == 'Mac OS X') {
    nativeClassifier = architecture in ['aarch64', 'arm64'] ? 'natives-macos-arm64' : 'natives-macos'
} else if (operatingSystem == 'Linux') {
    nativeClassifier = architecture in ['aarch64', 'arm64'] ? 'natives-linux-arm64' : 'natives-linux'
} else {
    throw new GradleException('The backend probe supports macOS and Linux')
}

dependencies {
    // Angelica expects these to be supplied by its host application.
    implementation 'org.ow2.asm:asm-tree:9.9.1'
    implementation 'org.ow2.asm:asm-commons:9.9.1'
    implementation('com.github.GTNewHorizons:lwjgl3ify:3.0.31:dev') { transitive = false }
    runtimeOnly('com.gtnewhorizons.retrofuturabootstrap:RetroFuturaBootstrap:1.1.0') { transitive = false }
    implementation project(':gl-audit')
    implementation project(':render-runtime')
    // ShaderManager's debug-environment check references Launch.blackboard. Never launch it.
    runtimeOnly('net.minecraft:launchwrapper:1.12') { transitive = false }
    runtimeOnly 'org.apache.commons:commons-lang3:3.21.0'
    runtimeOnly 'org.joml:joml:1.10.8'
    runtimeOnly 'it.unimi.dsi:fastutil:8.5.18'
    runtimeOnly 'org.apache.logging.log4j:log4j-api:2.26.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.26.1'
    runtimeOnly 'com.google.guava:guava:33.7.2-jre'
    implementation('com.gtnewhorizons.angelica:sdl-gpu:2.2.34') {
        // The upstream publication carries the publishing host's Linux natives.
        exclude group: 'org.lwjgl'
    }
    for (module in ['lwjgl', 'lwjgl-sdl', 'lwjgl-shaderc', 'lwjgl-spvc', 'lwjgl-opengl']) {
        implementation "org.lwjgl:${module}:3.4.2"
        runtimeOnly "org.lwjgl:${module}:3.4.2:${nativeClassifier}"
    }
}

application {
    mainClass = 'dev.julia.probe.BackendProbe'
    applicationName = 'backend-probe'
}

distributions {
    main {
        contents {
            from(rootProject.file('THIRD_PARTY.md'))
            from(rootProject.file('licenses')) { into 'licenses' }
        }
    }
}

[
    renderProbe: ['--render', 'metal', 'Runs the raw-device Metal clear and translated textured-draw probe'],
    adapterProbe: ['--adapter', 'adapter', 'Runs redirected OpenGL draws through the full offscreen GLSM adapter'],
    suiteProbe: ['--suite', 'suite', 'Runs the same native probe sequence as the ZombieBuddy mod']
].each { taskName, probe ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = probe[2]
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'dev.julia.probe.BackendProbe'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs '-XstartOnFirstThread', '--enable-native-access=ALL-UNNAMED'
        args probe[0], layout.buildDirectory.dir("reports/${probe[1]}").get().asFile.absolutePath
    }
}

tasks.named('test') {
    doFirst { systemProperty 'fixture.classpath', sourceSets.test.runtimeClasspath.asPath }
}
