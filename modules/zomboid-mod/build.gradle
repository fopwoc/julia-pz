configurations {
    runtimeClasspath.attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
    }
}

dependencies {
    runtimeOnly project(':backend-probe')
}

tasks.named('jar') {
    archiveFileName = 'Julia.jar'
    manifest { attributes 'Implementation-Version': project.version }
    from(configurations.runtimeClasspath) { into 'lib' }
}

tasks.register('modZip', Zip) {
    dependsOn tasks.named('jar')
    archiveFileName = 'Julia.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from('src/mod')
    from(tasks.named('jar')) { into 'Julia/42/media/java/client' }
    from(rootProject.file('THIRD_PARTY.md')) { into 'Julia' }
    from(rootProject.file('licenses')) { into 'Julia/licenses' }
}

tasks.named('assemble') { dependsOn tasks.named('modZip') }
