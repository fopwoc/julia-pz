plugins {
    id 'application'
}

dependencies {
    implementation project(':utils')
    implementation project(':backend')
    implementation project(':transform')
    implementation project(':host')
}

application {
    mainClass = 'dev.julia.probe.cli.ProbeMain'
    applicationName = 'probe'
}

distributions {
    main {
        contents {
            from(rootProject.file('THIRD_PARTY.md'))
            from(rootProject.file('licenses')) { into 'licenses' }
        }
    }
}

[
    renderProbe: ['--render', 'metal', 'Runs the raw-device Metal clear and translated textured-draw probe'],
    adapterProbe: ['--adapter', 'adapter', 'Runs redirected OpenGL draws through the full offscreen GLSM adapter'],
    suiteProbe: ['--suite', 'suite', 'Runs the same native probe sequence as the ZombieBuddy mod'],
].each { taskName, probe ->
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = probe[2]
        classpath = sourceSets.main.runtimeClasspath
        mainClass = application.mainClass
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
        jvmArgs '-XstartOnFirstThread', '--enable-native-access=ALL-UNNAMED'
        args probe[0], layout.buildDirectory.dir("reports/${probe[1]}").get().asFile.absolutePath
    }
}
